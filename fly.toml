# fly.toml — living instrument

app = "app-red-water-2820"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  DATA_DIR = "/data"

# Persistent volume holds the soul's state.json and every voice fragment.
# Create it once per region before deploying:
#   fly volumes create living_data --region iad --size 1
[[mounts]]
  source = "living_data"
  destination = "/data"

# The soul must keep evolving even when no one is watching, so we disable
# auto-stop and keep at least one machine running. Do not enable autoscale.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/state"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
