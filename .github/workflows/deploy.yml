name: deploy

on:
  push:
    branches:
      - main
      - claude/living-instrument-arpeggiator-FbtZZ
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: app-red-water-2820
      FLY_REGION: iad
      FLY_VOLUME: living_data
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure Fly app exists
        run: |
          if flyctl status -a "$FLY_APP" >/dev/null 2>&1; then
            echo "app $FLY_APP already exists"
          else
            echo "creating app $FLY_APP"
            flyctl apps create "$FLY_APP"
          fi

      - name: Ensure persistent volume exists
        run: |
          if flyctl volumes list -a "$FLY_APP" 2>/dev/null | grep -q "$FLY_VOLUME"; then
            echo "volume $FLY_VOLUME already exists"
          else
            echo "creating 1GB volume $FLY_VOLUME in $FLY_REGION"
            flyctl volumes create "$FLY_VOLUME" \
              -a "$FLY_APP" \
              --region "$FLY_REGION" \
              --size 1 \
              --yes
          fi

      - name: Deploy
        run: flyctl deploy --remote-only
